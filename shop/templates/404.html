{% extends 'shop/base.html' %}

{% block title %}Page not found | Nqoba Creative{% endblock %}

{% block content %}
<section class="section section-light">
    <div class="container" style="text-align:center;max-width:640px;">
        <h1 style="font-family:var(--font-heading);color:var(--primary);font-size:clamp(32px,5vw,48px);margin-bottom:16px;">
            We could not find that page
        </h1>
        <p style="color:var(--gray);line-height:1.8;margin-bottom:28px;">
            The link may be old or mistyped. Try the home page, or tell us what you need and we will help.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary">Go to the home page</a>
        <a href="{% url 'contact' %}" class="btn btn-outline-dark">Contact us</a>
    </div>
</section>
{% endblock %}
